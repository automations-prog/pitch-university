<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Screening Form Preview</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 20%, #7c3aed 0%, #4c1d78 35%, #2a1240 70%, #1a0b2e 100%);
    background-attachment: fixed;
  }

  .dot {
    position: fixed;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
  }

  .card {
    width: 100%;
    max-width: 420px;
    padding: 40px 36px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    color: #fff;
    position: relative;
    z-index: 1;
  }

  .icon-badge {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    font-size: 22px;
  }

  .brand {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 8px;
    background: linear-gradient(90deg, #e9d5ff, #f3e8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 8px 0 6px;
  }

  .subtitle {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.7);
    margin: 0 0 28px;
  }

  .field {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: rgba(255, 255, 255, 0.9);
  }

  input {
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 15px;
    outline: none;
    font-family: inherit;
  }

  input::placeholder { color: rgba(255,255,255,0.5); }
  input:focus { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.12); }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    opacity: 0.7;
  }

  .error-tag {
    display: none;
    margin-top: 6px;
    font-size: 12px;
    background: rgba(20, 10, 30, 0.9);
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    align-self: flex-end;
  }

  .field.has-error input { border-color: rgba(255,120,120,0.8); }
  .field.has-error .error-tag { display: inline-block; }

  button {
    width: 100%;
    padding: 14px 0;
    margin-top: 8px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(90deg, #7c3aed, #a855f7);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { filter: brightness(1.08); }
</style>
</head>
<body>

  <div class="dot" style="top:8%; left:8%; width:6px; height:6px;"></div>
  <div class="dot" style="top:70%; left:12%; width:5px; height:5px;"></div>
  <div class="dot" style="top:20%; right:6%; width:10px; height:10px; background:transparent; border:1px solid rgba(255,255,255,0.4);"></div>
  <div class="dot" style="top:50%; right:8%; width:5px; height:5px;"></div>
  <div class="dot" style="top:85%; right:20%; width:10px; height:10px; background:transparent; border:1px solid rgba(255,255,255,0.4);"></div>

  <form class="card" id="screeningForm">
    <div class="icon-badge">🎓</div>
    <div class="brand">Pitch University</div>
    <h1>Screening form</h1>
    <p class="subtitle">Please fill out your details below.</p>

    <div class="field">
      <label for="fullName">Full name</label>
      <input id="fullName" type="text" required />
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input id="email" type="email" required />
    </div>

    <div class="field">
      <label for="birthday">Birthday</label>
      <input id="birthday" type="date" required />
    </div>

    <div class="field" id="phoneField">
      <label for="phone">Phone number</label>
      <input id="phone" type="tel" required />
      <span class="error-tag">Digits, spaces, +, -, ( and ) only</span>
    </div>

    <button type="submit">Submit</button>
  </form>

<script>
  const phoneField = document.getElementById('phoneField');
  const phoneInput = document.getElementById('phone');
  phoneInput.addEventListener('input', () => {
    const valid = /^[0-9+\-() \s]*$/.test(phoneInput.value);
    phoneField.classList.toggle('has-error', !valid);
  });
  document.getElementById('screeningForm').addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Form submitted (demo only)');
  });
</script>
</body>
</html>
